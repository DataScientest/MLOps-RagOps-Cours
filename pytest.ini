[pytest]
# Offline test suite (fake LLM + fake embeddings). The other scripts in tests/ target a running stack.
testpaths = tests/unit
pythonpath = backend
addopts = -m "not live"
markers =
    live: needs a real LLM/embeddings endpoint (LiteLLM proxy with a valid API key), disabled by default
    meili: needs a Meilisearch instance (docker compose up -d meilisearch meili-init)
